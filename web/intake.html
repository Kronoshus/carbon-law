<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your Estate Planning Request | Carbon Law Group</title><link rel="stylesheet" href="styles.css"></head>
<body class="home-page">
<header class="home-nav"><a class="home-brand" href="index.html"><span class="home-mark">C</span><span>CARBON <i>LAW GROUP</i></span></a><nav></nav><a class="home-nav-cta" href="login.html">Sign out <span aria-hidden="true">↗</span></a></header>
<main class="intake-main"><div class="intake-progress" id="progress"></div><h1 id="stepTitle">Your request</h1><p class="intake-lede" id="stepIntro"></p><div id="stepBody"></div></main>
<footer class="home-footer"><a class="home-brand" href="index.html"><span class="home-mark">C</span><span>CARBON <i>LAW GROUP</i></span></a><span>California estate planning, with care.</span><div><a href="https://carbonlg.com">Carbon Law Group</a></div></footer>
<script src="auth.js"></script><script>
const API="https://carbon-law.onrender.com";
const stages=["Conflict check","Choose documents","Your information","Review drafts","Attorney review","Consultation","Signing"];
const user=getUser();let workflow=null;
const el=id=>document.getElementById(id);
async function call(path,method="GET",body){let response;try{response=await fetch(API+path,{method,headers:{"Content-Type":"application/json",Authorization:"Bearer "+getToken()},body:body?JSON.stringify(body):undefined})}catch(_){throw Error("We can’t reach the service right now. Please try again later.")}if(!response.ok){let d=await response.json().catch(()=>({}));throw Error(d.detail||"Request failed. Please try again.")}return response.json()}
function render(){if(!user||!getToken()){location.href="login.html";return}if(!workflow){showConflictStart();return}el("progress").innerHTML=progressMarkup(Math.min(stageIndex(workflow.stage),stages.length-1));el("stepTitle").textContent=stageTitle(workflow.stage);el("stepIntro").textContent=stageHelp(workflow.stage);el("stepBody").replaceChildren();({conflict_review:showConflictPending,conflict_hold:showConflictHold,document_selection:showDocumentSelection,intake:showIntake, draft_ready:showDraftReady,client_review:showClientReview,attorney_review:showAttorneyPending,consultation:showConsultation,signing:showSigning,complete:showComplete})[workflow.stage]?.()}
function stageIndex(s){return ({conflict_review:0,conflict_hold:0,document_selection:1,intake:2,draft_ready:3,client_review:3,attorney_review:4,consultation:5,signing:6,complete:7})[s]||0}
function stageTitle(s){return ({conflict_review:"Conflict check",conflict_hold:"We need to speak with you",document_selection:"Choose documents",intake:"Your planning details",draft_ready:"Review your information",client_review:"Review your draft documents",attorney_review:"Attorney review",consultation:"Schedule an initial phone consultation",signing:"Schedule signing",complete:"Request complete"})[s]||"Your request"}
function stageHelp(s){return ({conflict_review:"Before we collect detailed information, our staff will review the names you provide for potential conflicts. This is a manual review, not an automated database search.",conflict_hold:"We cannot continue the document workflow while a potential conflict is being reviewed. Please contact our office.",intake:"Complete the general questions and the questions for each document you selected. Save and return if needed.",draft_ready:"Your information is saved. Generate a clearly marked working draft for review.",client_review:"Read each draft. Approve it for attorney review or request changes.",attorney_review:"Your approval is recorded. An attorney must review the drafts before a consultation can be scheduled.",consultation:"The attorney has approved this review stage. Staff will schedule the initial phone consultation.",signing:"After the initial consultation, staff will arrange an in-person signing appointment.",complete:"Your signing appointment is scheduled. Staff will confirm details with you."})[s]||""}
function showConflictStart(){el("progress").innerHTML=progressMarkup(0);el("stepTitle").textContent="Start with a conflict check";el("stepIntro").textContent="We’ll review names before asking for detailed estate information. Submitting this request is not an engagement and is not legal advice.";el("stepBody").innerHTML=`<form id="startForm" class="intake-form"><div class="intake-warning"><strong>Please don’t include confidential details.</strong> This form is only for conflict screening and does not create an attorney-client relationship.</div><label>Your phone <input id="phone" maxlength="40" autocomplete="tel"></label><label>Names of other people/entities involved (Please Separate Names by Commas) <textarea id="related" maxlength="2000" placeholder="Spouse or partner, former spouse, co-trustee, business/entity names, or other parties relevant to the matter. Separate each name on a new line."></textarea></label><p class="fieldset-help">We use this information only for this conflict-review step. Staff handle real requests; this demo option runs a simulated review and does not check a conflicts database or clear you for legal services.</p><label class="intake-demo-choice"><input id="demoMode" type="checkbox"><span>Use simulated demo reviews (conflict check and attorney review)</span></label><button class="home-button">Continue to conflict review →</button></form>`;el("startForm").onsubmit=async e=>{e.preventDefault();const button=el("startForm").querySelector("button[type=submit],button:not([type])");button.disabled=true;button.textContent="Submitting…";try{const related_names=el("related").value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);const out=await call("/workflows","POST",{phone:el("phone").value,related_names,demo_mode:el("demoMode").checked});workflow=out;if(workflow.demo_mode){showDemoConflictReview();return}render()}catch(e){showError(e.message);button.disabled=false;button.textContent="Continue to conflict review →"}}}
function helpTip(text){const id="intake-tip-"+Math.random().toString(36).slice(2);return `<span class="intake-tip"><button class="intake-tip-button" type="button" aria-label="More information" aria-describedby="${id}">?</button><span class="intake-tip-text" role="tooltip" id="${id}">${escapeHtml(text)}</span></span>`}
function showDocumentSelection(){el("stepBody").innerHTML=`<form id="documentForm" class="intake-form"><h2>Choose the documents you would like to build ${helpTip("Select the estate-planning documents you want to discuss with an attorney. Your attorney will confirm which documents are right for you.")}</h2><p>Select documents you would like to discuss and prepare with an attorney. The attorney will confirm what fits your needs.</p><label class="choice"><input type="checkbox" name="requested" value="Revocable living trust"><span>Revocable living trust</span> ${helpTip("A trust that can generally be changed during your lifetime. Your attorney can explain whether it fits your needs.")}</label><label class="choice"><input type="checkbox" name="requested" value="Pour-over will"><span>Pour-over will</span> ${helpTip("A will that may direct certain assets into a trust. It still needs proper signing and witnesses.")}</label><label class="choice"><input type="checkbox" name="requested" value="Advance health care directive"><span>Advance health care directive</span> ${helpTip("A document for health-care wishes and naming someone to make decisions.")}</label><label class="choice"><input type="checkbox" name="requested" value="Financial power of attorney"><span>Financial power of attorney</span> ${helpTip("A document naming someone to handle financial matters on your behalf.")}</label><button class="home-button">Continue to planning questions →</button></form>`;el("documentForm").onsubmit=async e=>{e.preventDefault();const documents_requested=[...document.querySelectorAll('input[name="requested"]:checked')].map(x=>x.value);try{workflow=await call(`/workflows/${workflow.id}/documents`,"PATCH",{documents_requested});render()}catch(e){showError(e.message)}}}
function showDemoConflictReview(){el("progress").innerHTML=progressMarkup(0);el("stepTitle").textContent="Demo conflict-review simulation";el("stepIntro").textContent="This five-second animation is for demonstration only. It is not an AI check, conflicts-database search, real clearance, legal advice, or attorney-client engagement.";el("stepBody").innerHTML=`<section class="intake-form"><p id="demoStatus" role="status" aria-live="polite">Simulating conflicts check…</p><div class="demo-loader" aria-hidden="true"><span></span></div></section>`;setTimeout(async()=>{if(!workflow?.demo_mode||workflow.stage!=="conflict_review")return;try{workflow=await call(`/workflows/${workflow.id}/demo-conflict-review`,"POST",{});render()}catch(e){showError(e.message)}},5000)}
function progressMarkup(index){return `<div class="intake-progress-track" role="progressbar" aria-label="Request progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="${index+1}"><span style="width:${((index+1)/stages.length)*100}%"></span></div><ol class="intake-progress-steps">${stages.map((x,i)=>`<li class="${i<index?'done':i===index?'current':''}" ${i===index?'aria-current="step"':''}><span>${i+1}</span><span>${x}</span></li>`).join("")}</ol>`}
function showConflictPending(){const names=(workflow.related_names||[]).join(", ")||"None supplied";el("stepBody").innerHTML=`<section class="intake-form"><h2>Staff review is pending</h2><p>Names submitted: ${escapeHtml(names)}</p><p>No detailed information will be requested until staff records a clearance decision. For this demo only, you can run a clearly simulated five-second review.</p><button class="home-button" id="demoReview">Run demo simulation →</button> <button class="btn secondary" id="refresh">Check status</button></section>`;el("refresh").onclick=refresh;el("demoReview").onclick=async()=>{try{workflow=await call(`/workflows/${workflow.id}/enable-demo-review`,"POST",{});showDemoConflictReview()}catch(e){showError(e.message)}}}
function showConflictHold(){el("stepBody").innerHTML=`<section class="intake-warning"><strong>Workflow paused.</strong> Please contact the firm for next steps.</section>`}
function showIntake(){const specific={"Revocable living trust":[["Trust name (if chosen)","trust_name","Enter the name you want on the trust, if you have chosen one."],["Successor trustee names","successor_trustees","Who you would like your assets to go to."],["Distribution instructions to discuss","distributions","Describe how you would like your assets distributed; your attorney will help make this legally precise."]],"Pour-over will":[["Executor / personal representative","executor","Who you would like to handle your estate and carry out your will."],["Guardian for minor children (if applicable)","guardian","Who you would want to care for your minor children. Discuss this choice with your attorney."]],"Advance health care directive":[["Health care agent","health_agent","Who you would like to make health-care decisions if you cannot communicate."],["Alternate agent","alternate_health_agent","Your backup choice if your first health-care agent is unavailable."]],"Financial power of attorney":[["Agent for financial decisions","financial_agent","Who you would like to handle financial matters if you cannot do so."],["Alternate agent","alternate_financial_agent","Your backup choice if your first financial agent is unavailable."]]};const tip=(text)=>{const id="intake-tip-"+Math.random().toString(36).slice(2);return `<span class="intake-tip"><button class="intake-tip-button" type="button" aria-label="More information" aria-describedby="${id}">?</button><span class="intake-tip-text" role="tooltip" id="${id}">${escapeHtml(text)}</span></span>`};const rows=(workflow.documents_requested||[]).map(doc=>`<fieldset><legend>${escapeHtml(doc)} ${tip({"Revocable living trust":"A trust that can generally be changed during your lifetime. Your attorney can explain whether it fits your needs.","Pour-over will":"A will that may direct certain assets into a trust. It still needs proper signing and witnesses.","Advance health care directive":"A document for health-care wishes and naming someone to make decisions.","Financial power of attorney":"A document naming someone to handle financial matters on your behalf."}[doc]||"")}</legend>${(specific[doc]||[]).map(([label,key,help])=>`<label>${escapeHtml(label)} ${tip(help)}<textarea data-doc="${escapeHtml(doc)}" data-key="${escapeHtml(key)}" maxlength="2000"></textarea></label>`).join("")}</fieldset>`).join("");el("stepBody").innerHTML=`<form id="intakeForm" class="intake-form"><div class="intake-warning"><strong>Use general descriptions only.</strong> Don’t include account numbers, SSNs, passwords, or detailed medical records. This is not legal advice.</div><fieldset><legend>General information ${tip("Basic context to help the attorney understand your family, goals, and broad asset categories. Do not enter account numbers or sensitive details.")}</legend><label>Marital / family situation ${tip("Describe your family situation in general terms, such as married, single, divorced, or who depends on you.")}<textarea id="family" maxlength="2000"></textarea></label><label>Children / dependents ${tip("List children or others who depend on you. Use names or general descriptions as you prefer.")}<textarea id="dependents" maxlength="2000"></textarea></label><label>Goals and questions for the attorney ${tip("What would you like your estate plan to address? List questions you want to discuss.")}<textarea id="goals" maxlength="3000"></textarea></label><label>General asset categories (no account numbers) ${tip("Broad categories such as a home, retirement account, or business interest. Do not provide values, account numbers, or credentials.")}<textarea id="assets" maxlength="2000" placeholder="For example: home, retirement account, business interest"></textarea></label></fieldset>${rows}<button class="home-button">Save information →</button></form>`;el("intakeForm").onsubmit=async e=>{e.preventDefault();const docs={};for(const input of document.querySelectorAll("[data-doc]")){docs[input.dataset.doc]??={};docs[input.dataset.doc][input.dataset.key]=input.value}try{workflow=await call(`/workflows/${workflow.id}/intake`,"PATCH",{general:{family:el("family").value,dependents:el("dependents").value,goals:el("goals").value,asset_categories:el("assets").value},documents:docs});render()}catch(e){showError(e.message)}}}
function showDraftReady(){el("stepBody").innerHTML=`<section class="intake-form"><p>Check your answers, then prepare a working draft for review. These are not legal documents for signing.</p><button class="home-button" id="draft">Generate review drafts →</button></section>`;el("draft").onclick=async()=>{try{workflow=await call(`/workflows/${workflow.id}/drafts`,"POST",{});render()}catch(e){showError(e.message)}}}
function showClientReview(){const drafts=Object.entries(workflow.drafts||{}).map(([n,d])=>`<details><summary>${escapeHtml(n)} — ${escapeHtml(d.status)}</summary><pre>${escapeHtml(d.content)}</pre></details>`).join("");el("stepBody").innerHTML=`<section class="intake-form">${drafts}<label>Notes for changes <textarea id="reviewNote" maxlength="1000"></textarea></label><button class="btn secondary" id="changes">Request changes</button> <button class="home-button" id="approve">Approve for attorney review →</button></section>`;el("changes").onclick=()=>submitClientReview("changes_requested");el("approve").onclick=()=>submitClientReview("approved")}
async function submitClientReview(decision){try{workflow=await call(`/workflows/${workflow.id}/client-review`,"PATCH",{decision,note:el("reviewNote").value});render()}catch(e){showError(e.message)}}
function showAttorneyPending(){el("stepBody").innerHTML=`<section class="intake-form"><p>Client review is complete. An attorney must review the drafts before a consultation can be scheduled.</p>${workflow.demo_mode?`<div class="intake-warning"><strong>Demo only:</strong> this simulation is not an attorney review or legal approval.</div><button class="home-button" id="demoAttorney">Run simulated attorney review →</button>`:""}</section>`;el("demoAttorney")?.addEventListener("click",async()=>{const button=el("demoAttorney");button.disabled=true;button.textContent="Simulating review…";try{workflow=await call(`/workflows/${workflow.id}/demo-attorney-review`,"POST",{});render()}catch(e){showError(e.message);button.disabled=false;button.textContent="Run simulated attorney review →"}})}
function showConsultation(){showSchedule("consultation","Initial phone consultation")}
function showSigning(){showSchedule("signing","In-person signing")}
function showSchedule(kind,label){const times=Array.from({length:9},(_,i)=>`${String(i+9).padStart(2,"0")}:00`);el("stepBody").innerHTML=`<section class="intake-form"><h2>${label}</h2><p>Select a date and a time between 9:00 a.m. and 5:00 p.m. ${workflow.demo_mode?"Demo request times are confirmed immediately.":"Staff will confirm the requested time."}</p><label>Date <input id="date" type="date" required></label><label>Available time <select id="time" required>${times.map(t=>`<option value="${t}">${new Date(`2000-01-01T${t}:00`).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</option>`).join("")}</select></label><button class="home-button" id="schedule">${workflow.demo_mode?"Confirm time":"Request this time"} →</button></section>`;el("schedule").onclick=async()=>{if(!el("date").value){showError("Choose a date to continue.");return}try{workflow=await call(`/workflows/${workflow.id}/appointment`,"PATCH",{kind,scheduled_at:`${el("date").value}T${el("time").value}`});render()}catch(e){showError(e.message)}}}
function showComplete(){el("stepBody").innerHTML=`<section class="intake-form"><h2>Your request is complete</h2><p>Signing time: ${escapeHtml(workflow.appointments?.signing?.scheduled_at||workflow.appointments?.signing?.requested_at||"Pending staff confirmation")}</p><p>California execution requirements are document-specific; do not sign until your attorney gives instructions.</p><a class="home-button" href="index.html">Return to Carbon Law home →</a><p><a href="intake.html">View this completed workflow</a></p></section>`}
function showError(msg){let box=document.createElement("p");box.className="intake-error";box.textContent=msg;el("stepBody").prepend(box)}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function refresh(){try{workflow=await call("/my-workflow");render()}catch(e){showError(e.message)}}
if(!user||!getToken())location.href="login.html";else refresh();
</script></body></html>
