<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Carbon Law</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="auth-shell">
  <a class="auth-home" href="index.html">← Back to Carbon Law</a>
  <div class="auth-wrap">
  <form class="auth-card" id="authForm">
    <img src="https://carbonlg.com/wp-content/uploads/2023/08/Carbon-Law-Group-LOGO.png" alt="Carbon Law Group" style="height:40px;margin-bottom:16px;">
    <h2>Welcome back</h2>
    <p>Sign in to continue your estate-planning request.</p>
    <div class="form-group"><label>Email (your username)</label><input id="email" type="email" placeholder="you@example.com" autocomplete="username" required></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;" id="loginBtn" type="submit">Login</button>
    <pre id="out" style="margin-top:12px;font-size:13px;"></pre>
    <p style="margin-top:16px;font-size:13px;">Don’t have an account? <a href="signup.html">Create an account</a></p>
  </form>
  </div>
</div>
<script src="auth.js"></script>
<script>
document.getElementById("authForm")?.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("loginBtn");
  button.disabled = true; button.textContent = "Signing in…";
  try {
    const result = await api("/auth/login","POST",{
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });
    setToken(result.token); setUser(result.user);
    document.getElementById("out").textContent = "Logged in. Redirecting...";
    const u = result.user;
    setTimeout(() => window.location.href = (u.role==="client" ? "intake.html" : "admin.html"), 800);
  } catch (e) { document.getElementById("out").textContent = e.message; button.disabled = false; button.textContent = "Login"; }
});
</script>
</body>
</html>
