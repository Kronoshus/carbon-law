<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Asistente virtual — Oficina de Pankaj Raval</title>
<style>
  body { margin: 0; background: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  #stage { flex: 1; min-height: 0; position: relative; background: #111; display: flex; justify-content: center; }
  #stage canvas { height: 100%; aspect-ratio: 1; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; display: none; }
  #badge { position: fixed; top: 8px; left: 8px; background: #b00; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 14px; }
  #sub { padding: 12px 24px; font-size: 22px; text-align: center; min-height: 3em; background: #111; color: #fff; }
  #bar { padding: 8px; display: flex; gap: 8px; align-items: center; background: #eee; font-size: 14px; flex-wrap: wrap; }
  meter { width: 120px; }
  #status { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 2; background: rgba(0,0,0,.72);
            color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 18px; white-space: nowrap; }
  #status:empty { display: none; }
</style>
<div id="badge">Asistente virtual con IA · Conversación grabada</div>
<!-- Pre-rendered talking video (render.py) covers the 3D avatar when it exists. -->
<div id="stage"><video id="idle" src="video/idle.mp4" loop muted playsinline></video><video id="talk" playsinline></video><span id="status" role="status"></span></div>
<div id="sub" aria-live="polite">Para probar solo, use «Probar con micrófono». En una llamada de Zoom, use «Llamada de Zoom» y elija Pantalla completa.</div>
<div id="bar">
  <button id="mic">Probar con micrófono</button>
  <button id="zoom">Llamada de Zoom (pantalla completa)</button>
  <button id="next" disabled>Siguiente ▶</button>
  <label>Nivel <meter id="lvl" max="0.3"></meter></label>
  <label>Umbral de voz <input id="thr" type="range" min="0.005" max="0.15" step="0.005" value="0.03"></label>
  <select id="ver" title="Versión / Version">
    <option value="">Testamento · español</option><option value="?lang=en">Will · English</option>
    <option value="?guion=guion-fideicomiso">Fideicomiso · español</option><option value="?guion=guion-fideicomiso&lang=en">Trust · English</option>
    <option value="?guion=guion-plan">Plan completo (elige documentos) · español</option><option value="?guion=guion-plan&lang=en">Full plan (choose documents) · English</option>
    <option value="?chat=1">Conversación · español</option><option value="?chat=1&lang=en">Conversation · English</option>
  </select>
  <span id="note" style="color:#a00"></span>  <!-- operator-only notices: the client sees only the stage over Zoom -->
</div>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
// whole words, accent-aware (plain \b treats "í" as a word break, so "Sí" would not match)
const YES = /(?<!\p{L})(s[ií]|acepto|claro|de acuerdo|por supuesto|yes|yeah|yep|i agree|sure|ok|okay)(?!\p{L})/iu;
const NO = /(?<!\p{L})(no|not|nope|nah|never|nunca|don'?t|doesn'?t|rather not|prefiero que no)(?!\p{L})/iu;
// Recording consent must be an unmistakable yes. Refusal words alone = no. Yes and refusal words together
// ("no, no acepto", "claro que no", "I'm not okay with it") or neither = the operator decides; Cancel means no.
const consent = text => NO.test(text) ? (YES.test(text) ? null : false) : YES.test(text) ? true : null;
window.__consent = consent;  // debug / test hook

// ---------- avatar ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111);
stage.append(renderer.domElement);
const scene = new THREE.Scene();
// Square head-and-shoulders framing: the photo's cut-off shoulder edges stay out of view.
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.set(0, 0.12, 3.6);
const body = new THREE.Group();   // pivots at the waist so he leans like a seated person
body.position.y = -1.3;
scene.add(body);
let face, mouth = 0, jaw = 0, nextBlink = 2000;  // mouth: 0..1 target set by speak()
let round = 0, rnd = 0, brow = 0, listening = false, nod = 0;  // round: lip-rounding target set by speak()
let look = 0, lookTo = 0, nextLook = 3000;                          // gaze: mostly at the camera, brief glances aside
window.__pose = null;  // debug: __pose = [jaw, blink, round, brow, yaw, pitch, roll, look] freezes the face
// ?avatar=calavera: the 2D Day of the Dead skull (calavera.glb, make_calavera.py) instead of the photo of the attorney
const AV = new URLSearchParams(location.search).get('avatar') === 'calavera' ? 'calavera' : 'avatar';
new GLTFLoader().load(AV + '.glb', g => {
  g.scene.traverse(o => {
    if (!o.isMesh) return;        // unlit, so the photo looks like the photo
    const map = o.material.map;
    if (map) { map.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (o.name !== 'Background') map.wrapS = map.wrapT = THREE.ClampToEdgeWrapping; }
    // Avatar: blended edges (soft, like a photo) instead of a hard cut-out; Shadow: a soft dark patch on the wall
    o.material = new THREE.MeshBasicMaterial({ map, color: map ? 0xffffff : o.material.color, side: THREE.DoubleSide,
      transparent: o.name === 'Avatar' || o.name === 'Shadow', alphaTest: o.name === 'Avatar' ? 0.02 : 0,
      depthWrite: o.name !== 'Shadow' });
  });
  face = g.scene.getObjectByName('Avatar');
  scene.add(g.scene);
  body.add(face);                 // MouthInside is parented to it in Blender
  face.position.y = 1.3;
}, undefined, () => $('status').textContent = `Falta ${AV}.glb — ejecute ${AV === 'calavera' ? 'make_calavera' : 'make_avatar'}.py en Blender.`);
function frame(t) {
  const s = Math.min(stage.clientWidth, stage.clientHeight);
  if (renderer.domElement.width !== s) renderer.setSize(s, s, false);
  if (face) {
    jaw += (mouth - jaw) * 0.45;
    if (t > nextBlink + 220) nextBlink = t + 2200 + Math.random() * 3800;
    const d = t - nextBlink, blink = d < 0 ? 0 : d < 80 ? d / 80 : Math.max(0, 1 - (d - 80) / 140);
    rnd += (round - rnd) * 0.35;
    brow += ((jaw > 0.3 ? 0.7 : listening ? 0.15 : 0) - brow) * 0.06;   // lifts on stressed syllables
    nod += ((listening ? 1 : 0) - nod) * 0.03;                          // attentive nodding while the client talks
    if (t > nextLook) { lookTo = Math.random() < 0.6 ? 0 : Math.random() * 1.2 - 0.6; nextLook = t + 900 + Math.random() * 3200; }
    look += (lookTo - look) * 0.4;
    // the head drifts on the neck (slow wander + a dip on stressed syllables + nods while listening); shoulders barely move
    const yaw = Math.sin(t / 3700) * 0.45 + Math.sin(t / 1300) * 0.15 + look * 0.25;
    const pitch = Math.sin(t / 2900) * 0.25 - jaw * 0.5 - nod * Math.max(0, Math.sin(t / 700)) * 0.5;
    const roll = Math.sin(t / 4300) * 0.35 + Math.sin(t / 1700) * 0.1;
    const P = window.__pose || [jaw, blink, rnd, brow, yaw, pitch, roll, look];
    const M = face.morphTargetDictionary, I = face.morphTargetInfluences;
    ['jawOpen', 'blink', 'mouthRound', 'browUp', 'headYaw', 'headPitch', 'headRoll', 'lookX'].forEach((k, i) => I[M[k]] = P[i] || 0);
    body.rotation.z = Math.sin(t / 2300) * 0.006;
    body.rotation.y = Math.sin(t / 3100) * 0.02;
    body.rotation.x = Math.sin(t / 2700) * 0.005;
    body.position.y = -1.3 + Math.sin(t / 1600) * 0.004;   // breathing
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- audio ----------
let ctx, inAnalyser, inStream, skip = () => {};
const rms = an => {
  const b = new Uint8Array(an.fftSize); an.getByteTimeDomainData(b);
  return Math.sqrt(b.reduce((s, v) => s + ((v - 128) / 128) ** 2, 0) / b.length);
};
$('next').onclick = () => skip();

// English version: add ?lang=en  (loads guion-en.json / guion-fideicomiso-en.json)
const q = new URLSearchParams(location.search), EN = q.get('lang') === 'en';
const guionName = (q.get('guion') || 'guion') + (EN ? '-en' : '');
const t = (es, en) => EN ? en : es;
// version picker: reloads the page with the chosen script / language / mode, keeping the chosen avatar
{ const p = new URLSearchParams(location.search); ['avatar', 'wait', 'zoom'].forEach(k => p.delete(k)); $('ver').value = p.toString() ? '?' + p : ''; }
$('ver').onchange = e => location.search = e.target.value + (AV === 'calavera' ? (e.target.value ? '&' : '?') + 'avatar=calavera' : '');
if (EN) {
  document.documentElement.lang = 'en';
  document.title = 'Virtual assistant — Office of Pankaj Raval';
  for (const [id, s] of Object.entries({ badge: 'AI virtual assistant · Conversation recorded', sub: 'To test alone, use "Test with microphone". On a Zoom call, use "Zoom call" and choose Entire screen.',
    mic: 'Test with microphone', zoom: 'Zoom call (entire screen)', next: 'Next ▶' })) $(id).textContent = s;
  $('lvl').previousSibling.textContent = 'Level ';
  $('thr').previousSibling.textContent = 'Voice threshold ';
}
$('idle').oncanplay = e => { e.target.style.display = 'block'; e.target.play(); };

// Plays a pre-rendered clip. Resolves true when it finished, false if there is no clip.
function playVideo(src) {
  const v = $('talk');
  return new Promise(res => {
    v.onerror = () => res(false);
    v.onplaying = () => v.style.display = 'block';
    v.onended = () => { v.style.display = 'none'; res(true); };
    skip = () => { v.pause(); v.style.display = 'none'; res(true); };
    v.src = src;
    v.play().catch(() => res(false));
  });
}

// Mouth shape for the letter being spoken at time tm: [openness 0..1, lip rounding 0..1].
// ponytail: letters, not phonemes: good for Spanish, rougher for English spelling. Swap in a phoneme aligner if it matters.
const VIS = { a: [1, 0], e: [0.65, 0], i: [0.4, 0], o: [0.7, 0.8], u: [0.35, 1], w: [0.3, 1],
  m: [0, 0.2], b: [0, 0.2], p: [0, 0.2], f: [0.15, 0], v: [0.15, 0] };
const vis = ch => { const c = (ch || ' ').normalize('NFD')[0].toLowerCase(); return VIS[c] || (/[a-z]/.test(c) ? [0.45, 0.1] : [0, 0]); };
function viseme(al, tm) {
  if (!al) return [1, 0];
  const s = al.character_start_times_seconds;
  let i = 0;
  while (i < s.length - 1 && s[i + 1] <= tm) i++;
  return vis(al.characters[i]);
}

const voiced = new Map();   // text -> pending /tts reply, so a line can be fetched before it is needed
const note = m => { const n = $('note'); if (!n.textContent.includes(m)) n.textContent += (n.textContent ? ' · ' : '') + m; };
let backup = '';            // set on the first ElevenLabs failure: the rest of the session keeps one (backup) voice
const voice = text => backup ? Promise.resolve({ error: backup }) : voiced.get(text) || voiced.set(text,
  fetch('/tts', { method: 'POST', body: JSON.stringify({ text, lang: t('es', 'en') }) }).then(r => r.json()).catch(e => ({ error: e.message }))).get(text);

async function speak(text, id) {
  if (!text.trim()) return;   // nothing to say
  $('sub').textContent = text;
  if (id && await playVideo(`video/${guionName}/${id}.mp4`)) return sleep(400);
  const v = await voice(text);
  voiced.delete(text);
  if (v.audio_base64) {
    const { audio_base64, alignment: al } = v;
    const audio = new Audio(`data:${v.mime || 'audio/mpeg'};base64,` + audio_base64);
    const an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaElementSource(audio).connect(an).connect(ctx.destination);
    const lip = setInterval(() => {   // loudness sets how far the jaw opens, the letter being spoken sets the shape
      const [open, r] = viseme(al, audio.currentTime);
      mouth = Math.min(0.5, rms(an) * 3.2) * (0.3 + 0.7 * open);   // speech-sized opening, not a yawn
      round = r;
    }, 40);
    await new Promise(res => { audio.onended = audio.onerror = res; skip = () => { audio.pause(); res(); }; audio.play(); });
    clearInterval(lip);
  } else {  // ElevenLabs unavailable: the browser's own voice from here on, and tell the operator why
    backup = v.error || 'error';
    note(t('Voz de respaldo: ', 'Backup voice: ') + (/quota/.test(v.error) ? t('se acabó el saldo de ElevenLabs', 'ElevenLabs credits are used up')
      : /no key/.test(v.error) ? t('falta la clave de ElevenLabs', 'no ElevenLabs key') : t('el servicio de voz no respondió', 'the voice service did not answer')));
    const u = new SpeechSynthesisUtterance(text); u.lang = t('es-US', 'en-US');
    // the browser reports each word as it starts; between reports, advance through the letters at speaking pace
    let at = 0, since = performance.now();
    u.onboundary = e => { at = e.charIndex; since = performance.now(); };
    const lip = setInterval(() => {
      const [open, r] = vis(text[at + Math.floor((performance.now() - since) / 70)]);
      mouth = 0.42 * open; round = r;
    }, 40);
    await new Promise(res => { u.onend = u.onerror = res; skip = () => { speechSynthesis.cancel(); res(); }; speechSynthesis.speak(u); });
    clearInterval(lip);
  }
  mouth = round = 0;
  await sleep(400);  // let the room/Zoom echo die before we listen
}

// Record until the speaker has been quiet 2.5 s (or operator presses Siguiente).
// ponytail: amplitude VAD; swap for a real VAD model if noisy lines cut people off.
async function listen() {
  const rec = new MediaRecorder(new MediaStream(inStream.getAudioTracks()));
  const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
  rec.start(); listening = true;
  const t0 = performance.now(); let last = 0, stop = false;
  skip = () => stop = true;
  $('status').textContent = t('🎙 Escuchando…', '🎙 Listening…');
  while (!stop) {
    await sleep(100);
    const now = performance.now(), v = rms(inAnalyser);
    $('lvl').value = v;
    if (v > +$('thr').value) last = now;
    if ((last && now - last > 2500) || (!last && now - t0 > 25000) || now - t0 > 180000) stop = true;
  }
  $('status').textContent = ''; listening = false;
  await new Promise(res => { rec.onstop = res; rec.stop(); });
  return new Blob(chunks, { type: 'audio/webm' });
}

// ---------- interview ----------
async function run(getStream) {
  $('mic').disabled = $('zoom').disabled = true;
  try {
    inStream = await getStream();
    if (!inStream.getAudioTracks().length) throw new Error(t('No se compartió audio. En Zoom: elija "Pantalla completa" y marque "Compartir audio del sistema".',
      'No audio was shared. For Zoom: choose "Entire screen" and tick "Share system audio".'));
  } catch (e) { $('sub').textContent = e.message; $('mic').disabled = $('zoom').disabled = false; return; }
  ctx = new AudioContext();
  inAnalyser = ctx.createAnalyser(); inAnalyser.fftSize = 1024;
  ctx.createMediaStreamSource(new MediaStream(inStream.getAudioTracks())).connect(inAnalyser);
  $('next').disabled = false;

  // wait 7 seconds after access is granted before speaking; Siguiente starts now. ?wait=0 = no wait
  let ready = false; skip = () => ready = true;
  for (let left = +(q.get('wait') ?? 7); left > 0 && !ready; left--) {
    $('status').textContent = t(`Comienza en ${left} s · Siguiente ▶ para empezar ya`, `Starting in ${left} s · Next ▶ to start now`);
    await sleep(1000);
  }
  $('status').textContent = '';
  await ctx.resume();
  if (ctx.state !== 'running') {   // Chrome plays sound only after a click on the page; one click is enough
    $('sub').textContent = t('Haga clic en cualquier parte de la página para que el asistente empiece a hablar.', 'Click anywhere on the page so the assistant can start speaking.');
    await new Promise(res => addEventListener('pointerdown', res, { once: true }));
    await ctx.resume();
  }

  const guion = await (await fetch(guionName + '.json')).json();  // ?guion=guion-fideicomiso
  if (AV === 'calavera')   // the skull is not his likeness: the disclosure says only that it is an AI program
    guion.forEach(s => s.say = s.say.replace(' con su imagen', '').replace(' that uses his likeness', ''));
  const session = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const answers = [];
  // the documents to draft: a will for the will scripts; chosen by the client in the full-plan script; none otherwise
  let docs = /^guion(-en)?$/.test(guionName) ? ['will'] : [];
  const save = () => fetch('/save?session=' + session, { method: 'POST', body: JSON.stringify({ session, lang: t('es', 'en'), docs, answers }) });

  // record one reply, save its audio, get its transcript
  const hear = async id => {
    const blob = await listen();
    $('status').textContent = t('Transcribiendo…', 'Transcribing…');
    const r = await (await fetch(`/answer?session=${session}&step=${id}&lang=${t('es', 'en')}`, { method: 'POST', body: blob })).json();
    $('status').textContent = '';
    return r;
  };
  const record = async (id, label, question, r) => {
    answers.push({ id, label, question, text: r.text || '', audio: r.audio });
    await save();  // save after every answer: a dropped call loses nothing
  };
  // ?chat=1: after consent and the conflict check the model (server /chat) leads a free conversation. Returns an error message, if any.
  const converse = async first => {
    const messages = [{ role: 'user', content: first }];
    let covered = [];   // the model's hidden checklist: question ids already dealt with
    for (let turn = 1, quiet = 0; turn <= 90 && quiet < 2; turn++) {   // stop after two silent turns
      $('status').textContent = t('Pensando…', 'Thinking…');
      const res = await fetch('/chat', { method: 'POST', body: JSON.stringify({ guion: guionName, lang: t('es', 'en'), messages, covered, docs, avatar: AV }) });
      $('status').textContent = '';
      const { text, reasoning, error, ...c } = await res.json();
      if (!res.ok) return t('Error del modelo: ', 'Model error: ') + error;
      covered = c.covered;
      if (c.docs.length) docs = c.docs;
      $('note').textContent = (docs.length ? t('Documentos: ', 'Documents: ') + docs.join(', ') + ' · ' : '')
        + t('Pendiente: ', 'Still to ask: ') + (c.open.join(', ') || '—');   // operator only
      const say = text.replace('[FIN]', '').trim();
      messages.push({ role: 'assistant', content: c.history || say, reasoning_content: reasoning });   // Beam needs its reasoning back
      await speak(say);
      if (text.includes('[FIN]')) return;
      const r = await hear('t' + turn);
      await record('t' + turn, t('Turno ', 'Turn ') + turn, say, r);
      quiet = r.text ? 0 : quiet + 1;
      messages.push({ role: 'user', content: r.text || t('(silencio)', '(silence)') });
    }
  };

  let fail, agreed = '';
  try {
  for (const [i, step] of guion.entries()) {
    // fetch the next line's voice now so there is no wait after this one (not across consent: it may never be said)
    if (guion[i + 1] && !step.consent) voice(guion[i + 1].say);
    await speak(step.say, step.id);
    if (!step.ask) continue;
    const r = await hear(step.id);
    await record(step.id, step.label, step.say, r);
    if (step.consent) {
      const ok = consent(r.text || '') ?? confirm(t('No se entendió la respuesta. ¿El cliente ACEPTÓ ser grabado?', 'The answer was not understood. Did the client AGREE to be recorded?'));
      if (!ok) {
        answers.length = 0;
        await fetch('/declined?session=' + session, { method: 'POST' });   // deletes the consent answer's audio + transcript
        await speak(t('Entendido. No continuaremos con la grabación. La oficina del abogado Raval se comunicará con usted. Gracias.',
          'Understood. We will not continue with the recording. The office of attorney Raval will contact you. Thank you.'));
        fail = t('El cliente no aceptó la grabación. No se guardó audio.', 'The client declined recording. No audio was kept.');
        break;
      }
      agreed = r.text || t('Sí, acepto.', 'Yes, I agree.');
    }
    if (step.conflict) {   // names only, before any details: the firm checks for conflicts of interest first
      const post = extra => fetch('/conflict?session=' + session, { method: 'POST', body: JSON.stringify({ text: r.text || '', ...extra }) }).then(x => x.json());
      let { status } = await post({});
      if (status === 'no_list') {
        const ok = confirm(t('No hay lista de conflictos (conflicts.csv). ¿La oficina ya aprobó a este cliente en la revisión de conflictos?',
          'There is no conflict list (conflicts.csv). Has the firm already cleared this client for conflicts?'));
        await post({ operator: ok });
        status = ok ? 'clear' : 'possible';
      }
      if (status !== 'clear') {   // say nothing about why: other clients' names are confidential
        await speak(t('Gracias. Antes de continuar, la oficina necesita revisar alguna información. La oficina del abogado Raval se comunicará con usted pronto. Gracias por su paciencia.',
          'Thank you. Before we continue, the office needs to review some information. The office of attorney Raval will contact you soon. Thank you for your patience.'));
        note(t('Posible conflicto de intereses: entrevista detenida antes de los detalles. Ver ', 'Possible conflict of interest: interview stopped before any details. See ')
          + `sessions/${session}/conflict.md`);
        fail = t('Entrevista en pausa.', 'Interview paused.');
        break;
      }
      if (q.get('chat') || guionName.startsWith('guion-plan')) {   // the full plan is always a conversation
        const err = await converse(agreed + '\n' + (r.text || ''));
        if (!err) break;
        // model unavailable: tell the operator, carry on with the scripted questions so the client is not left hanging
        note(err + t(' — se siguen las preguntas fijas', ' — continuing with the scripted questions'));
      }
    }
  }
  } catch (e) {   // network or service failure: say so on screen; every answer so far is already on disk
    listening = false; mouth = round = 0; $('status').textContent = '';
    fail = t('Se interrumpió la entrevista: ', 'The interview was interrupted: ') + e.message
      + t('. Las respuestas anteriores están guardadas en', '. Earlier answers are saved in') + ` sessions/${session}/`;
  }
  inStream.getTracks().forEach(t => t.stop());
  // memo + draft for the attorney (needs the model key). Not after a refusal, a possible conflict or a failure:
  // nothing more is processed for that client.
  if (!fail && answers.some(a => !['consentimiento', 'conflicto'].includes(a.id))) {
    $('status').textContent = t('Preparando resumen y borradores… (unos minutos)', 'Preparing memo and drafts… (a few minutes)');
    await save();   // with the documents chosen
    await fetch('/summary?session=' + session, { method: 'POST' }).catch(() => {});
    $('status').textContent = '';
  }
  $('next').disabled = true;
  $('sub').textContent = fail || t('Entrevista terminada. Guardada en', 'Interview finished. Saved in') + ` sessions/${session}/intake.md`;
}
$('mic').onclick = () => run(() => navigator.mediaDevices.getUserMedia({ audio: true }));
// Ask for the microphone as soon as the page opens (not for Zoom calls: open the page with ?zoom=1 and use the Zoom button).
// Screen and system-audio sharing cannot start on its own: Chrome only allows it after a click.
if (!q.has('zoom')) $('mic').onclick();
// Zoom: capture what the PC plays (the client's voice) — pick "Entire screen" + "share system audio".
$('zoom').onclick = () => run(() => navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'monitor' }, audio: { echoCancellation: false, noiseSuppression: false },
    systemAudio: 'include', monitorTypeSurfaces: 'include', surfaceSwitching: 'exclude', selfBrowserSurface: 'exclude' }));
</script>
</html>
