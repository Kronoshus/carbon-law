<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to your Carbon Law Group account to continue your estate-planning request."><title>Sign in | Carbon Law Group</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="img/carbon-law-group-mark.png"></head>
<body>
<div class="auth-shell">
  <a class="auth-home" href="index.html">Back to Carbon Law Group</a>
  <div class="auth-wrap">
  <form class="auth-card" id="authForm">
    <img class="auth-logo" src="img/carbon-law-group-logo.png" srcset="img/carbon-law-group-logo.png 1x, img/carbon-law-group-logo@2x.png 2x" width="126" height="35" alt="Carbon Law Group">
    <h2>Welcome back</h2>
    <p>Sign in to continue your estate-planning request.</p>
    <div class="form-group"><label for="email">Email (your username)</label><input id="email" type="email" placeholder="you@example.com" autocomplete="username" required></div>
    <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password" required></div>
    <button class="btn block" id="loginBtn" type="submit">Sign in</button>
    <p id="out" role="status" aria-live="polite"></p>
    <p class="auth-alt">Don’t have an account? <a href="signup.html">Create an account</a></p>
  </form>
  </div>
</div>
<script src="auth.js"></script>
<script>
document.getElementById("authForm")?.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("loginBtn");
  button.disabled = true; button.textContent = "Signing in…";
  try {
    const result = await api("/auth/login","POST",{
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });
    setToken(result.token); setUser(result.user);
    document.getElementById("out").textContent = "Logged in. Redirecting...";
    const u = result.user;
    const destination = u.role === "client" ? await api("/my-workflow", "GET", null, result.token).then(workflow => workflow?.stage === "complete" || (workflow?.appointments?.consultation?.requested_at && workflow?.appointments?.signing?.requested_at) ? "portal.html" : "intake.html").catch(() => "intake.html") : "admin.html";
    setTimeout(() => window.location.href = destination, 800);
  } catch (e) {
    document.getElementById("out").textContent = e.message.includes("invalid credentials")
      ? "We couldn’t find an account with that email and password. Check both, or create an account below."
      : e.message;
    button.disabled = false; button.textContent = "Sign in";
  }
});
</script>
</body>
</html>
