<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Carbon Law Group matter dashboard for staff."><meta name="robots" content="noindex"><title>Matter dashboard | Carbon Law Group</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="img/carbon-law-group-mark.png"></head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="index.html"><img src="img/carbon-law-group-logo-white.png" srcset="img/carbon-law-group-logo-white.png 1x, img/carbon-law-group-logo-white@2x.png 2x" width="116" height="32" alt="Carbon Law Group"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html" class="active" aria-current="page">Matter dashboard</a>
      <a href="admin.html">Staff dashboard</a>
      <a href="portal.html">Client portal</a>
      <a href="prompts.html">Prompt library</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </aside>
  <main class="main-content" hidden>
    <div class="topbar">
      <h1>Matter dashboard</h1>
      <div class="actions">
        <button class="btn sm" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><h2 id="total">—</h2><p>Active matters</p></div>
      <div class="stat"><h2 id="highRisk">—</h2><p>High risk</p></div>
      <div class="stat"><h2 id="review">—</h2><p>Attorney review</p></div>
      <div class="stat"><h2 id="urgent">—</h2><p>Urgent</p></div>
      <div class="stat"><h2 id="overdue">—</h2><p>Overdue</p></div>
    </div>
    <div class="filters">
      <input id="search" placeholder="Search client or matter ID" aria-label="Search client or matter ID">
      <select id="stageFilter" aria-label="Stage"><option value="">All stages</option></select>
      <select id="riskFilter" aria-label="Risk"><option value="">All risk</option><option>Low</option><option>Medium</option><option>High</option></select>
      <select id="ownerFilter" aria-label="Owner"><option value="">All owners</option></select>
    </div>
    <div class="card flush">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Matter</th><th>Client</th><th>Stage</th><th>Owner</th><th>Due</th><th>Risk</th><th>Priority</th><th>Next action</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty" style="display:none;">No matters found.</div>
    </div>
    <div class="section report-section">
      <h2>Friday report</h2>
      <p><button class="btn secondary sm" id="genReport">Generate Friday report</button></p>
      <div id="report"></div>
    </div>
  </main>
</div>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
