<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PromptLaw - Carbon Law</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site">
  <a href="index.html"><img class="logo" src="https://carbonlg.com/wp-content/uploads/2023/08/Carbon-Law-Group-LOGO.png" alt="Carbon Law Group"></a>
  <nav class="main">
    <a href="index.html#services">Services</a>
    <a href="login.html">Staff sign in</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>
<section class="section" hidden>
<h2>PromptLaw California Prompt Library</h2>
<p>Browse the California estate planning prompt files and templates used for document drafting.</p>
<div class="grid">
  <div class="card"><h3>Prompts</h3><ul id="promptList"></ul></div>
  <div class="card"><h3>Templates</h3><ul id="templateList"></ul></div>
  <div class="card"><h3>Selected Content</h3><pre id="contentView"></pre></div>
</div>
</section>
<footer><p>Carbon Law Group | (323) 543-4453 | <a href="https://carbonlg.com">carbonlg.com</a></p></footer>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
const PROMPTS_API = "https://carbon-law.onrender.com";
function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function request(path){const headers={}; if(getToken()) headers.Authorization="Bearer "+getToken(); let res;try{res=await fetch(PROMPTS_API+path,{headers})}catch(_){throw new Error("Could not reach the Carbon backend. Check your connection and try again.")}if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.detail||`Request failed (${res.status}).`)}return res.json();}
async function loadLists() {
  try {
    const user=await CarbonAuth.requireServerAuth(["paralegal","attorney","admin"]);
    if(!user)return;
    document.querySelector(".section").hidden=false;
    const prompts = await request("/prompts");
    const pl = document.getElementById("promptList");
    pl.innerHTML = prompts.map(p=>`<li><a href="#" data-type="prompt" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)}</a></li>`).join("");
    const templates = await request("/templates");
    const tl = document.getElementById("templateList");
    tl.innerHTML = templates.map(t=>`<li><a href="#" data-type="template" data-name="${escapeHtml(t.name)}">${escapeHtml(t.name)}</a></li>`).join("");
    document.querySelectorAll("a[data-name]").forEach(a => {
      a.addEventListener("click", async (e) => {
        e.preventDefault();
        const type = a.getAttribute("data-type");
        const name = a.getAttribute("data-name");
        const view=document.getElementById("contentView");
        try { const data = await request(`/${type}s/${encodeURIComponent(name)}`); view.textContent = data.content; }
        catch(error) { view.textContent = error.message; }
      });
    });
  } catch(e) { document.querySelector(".section").hidden=false; document.getElementById("contentView").textContent = e.message; }
}
loadLists();
</script>
</body></html>
