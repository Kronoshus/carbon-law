name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aprende_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APRENDE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/aprende_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r backend/requirements.txt httpx pytest
      - name: backend pytest (SQLite + Postgres)
        run: python -m pytest -q tests
      - name: avatar-intake check
        run: cd avatar-intake && python server.py --check

  render:
    # Builds and starts the backend the way Render does: repo root, root requirements.txt only, Python 3.11.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: start as on Render and answer /health
        run: bash scripts/render-check.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aprende/package-lock.json
      - name: install
        run: cd aprende && npm ci
      - name: typecheck
        run: cd aprende && npm run typecheck
      - name: lint
        run: cd aprende && npm run lint
      - name: test
        run: cd aprende && npm run test
      - name: build web
        run: cd aprende && npm run build:web
      - name: build extension
        run: cd aprende && npm run build:ext
      - name: i18n parity
        run: cd aprende && npm run i18n:check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aprende/package-lock.json
      - run: python -m pip install -r requirements.txt -r backend/requirements.txt
      - run: cd aprende && npm ci
      - run: cd aprende && npx playwright install --with-deps chromium
      - run: cd aprende && npm run build:ext
      - run: cd aprende && npm run test:e2e
