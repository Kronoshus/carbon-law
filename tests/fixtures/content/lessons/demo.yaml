id: demo
unit: will
day: 1
character: calavera
sensitive: false
datos: [nombre, hijos]
title: {es: Lección de prueba, en: Test lesson}
steps:
  - id: demo.1
    title: {es: Primer paso, en: First step}
    items:
      - id: demo.1.1
        kind: explain
        legal: true
        source: pc-6110
        es: {text: Un testamento escrito a máquina lo firman usted y dos testigos.}
        en: {text: A typed will is signed by you and two witnesses.}
      - id: demo.1.2
        kind: choice
        legal: true
        source: pc-6110
        answer: 2
        es: {prompt: ¿Cuántos testigos?, options: [Ninguno, Uno, Dos], explain: Dos testigos presentes juntos.}
        en: {prompt: How many witnesses?, options: [None, One, Two], explain: Two witnesses present together.}
      - id: demo.1.3
        kind: truefalse
        answer: false
        es: {statement: Un testamento necesita notario., explain: No es obligatorio.}
        en: {statement: A will needs a notary., explain: It is not required.}
      - id: demo.1.4
        kind: match
        character: pinata
        es: {prompt: Una cada palabra, pairs: [[albacea, cumple el testamento], [tutor, cuida a los hijos]], explain: Bien.}
        en: {prompt: Match each word, pairs: [[executor, carries out the will], [guardian, cares for the children]], explain: Good.}
      - id: demo.1.5
        kind: order
        es: {prompt: Ordene los pasos, steps: [Escribir, Firmar, Guardar], explain: Así.}
        en: {prompt: Put the steps in order, steps: [Write, Sign, Store], explain: Like that.}
