<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Carbon Law</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site">
  <a href="index.html"><img class="logo" src="https://carbonlg.com/wp-content/uploads/2023/08/Carbon-Law-Group-LOGO.png" alt="Carbon Law Group"></a>
  <nav class="main"><a href="index.html">Home</a><a href="portal.html">Client Portal</a></nav>
</header>
<section class="section">
<h2>Login</h2>
<div class="form">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginBtn">Login</button>
<pre id="out"></pre>
</div>
</section>
<script src="auth.js"></script>
<script>
document.getElementById("loginBtn")?.addEventListener("click", async () => {
  try {
    const result = await api("/auth/login","POST",{
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });
    setToken(result.token); setUser(result.user);
    document.getElementById("out").textContent = "Logged in. Redirecting...";
    const u = result.user;
    setTimeout(() => window.location.href = (u.role==="client" ? "portal.html" : "admin.html"), 800);
  } catch (e) { document.getElementById("out").textContent = e.message; }
});
</script>
</body></html>
