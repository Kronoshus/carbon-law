<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Carbon Law</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <img src="https://carbonlg.com/wp-content/uploads/2023/08/Carbon-Law-Group-LOGO.png" alt="Carbon Law Group" style="height:40px;margin-bottom:16px;">
    <h2>Welcome back</h2>
    <p>Sign in to continue to your private estate planning workspace.</p>
    <div class="form-group"><label>Email</label><input id="email" type="email" placeholder="Email" required></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="Password" required></div>
    <button class="btn" style="width:100%;" id="loginBtn">Login</button>
    <pre id="out" style="margin-top:12px;font-size:13px;"></pre>
    <p style="margin-top:16px;font-size:13px;">New here? <a href="signup.html">Create a private account</a></p>
  </div>
</div>
<script src="auth.js"></script>
<script>
document.getElementById("loginBtn")?.addEventListener("click", async () => {
  try {
    const result = await api("/auth/login","POST",{
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    });
    setToken(result.token); setUser(result.user);
    document.getElementById("out").textContent = "Logged in. Redirecting...";
    const u = result.user;
    setTimeout(() => window.location.href = (u.role==="client" ? "portal.html" : "admin.html"), 800);
  } catch (e) { document.getElementById("out").textContent = e.message; }
});
</script>
</body>
</html>
