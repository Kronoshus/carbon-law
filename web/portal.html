<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Your Carbon Law Group client portal: planning request, changes and documents."><meta name="robots" content="noindex"><title>Client portal | Carbon Law Group</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="img/carbon-law-group-mark.png"></head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="index.html"><img src="img/carbon-law-group-logo-white.png" srcset="img/carbon-law-group-logo-white.png 1x, img/carbon-law-group-logo-white@2x.png 2x" width="116" height="32" alt="Carbon Law Group"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="portal.html" class="active" aria-current="page">Matter overview</a>
    </nav>
    <div class="user-box" id="userBox"></div>
  </aside>
  <main class="main-content">
    <div class="topbar"><h1>Matter overview</h1>
      <div class="actions"><button class="btn secondary sm" onclick="logout()">Sign out</button></div>
    </div>
    <div class="section">
      <h2>My planning request</h2>
      <div id="planningRequest" class="card">Loading your planning request…</div>
    </div>
    <div class="section">
      <h2>Change request status</h2><div id="changeRequestStatus" class="card">Loading your requests…</div>
    </div>
    <div class="grid2">
      <div class="section">
        <h2>Submit a change request</h2>
        <div class="card">
          <form id="changeForm">
            <div class="form-group"><label for="changeType">Change type</label><select id="changeType"><option>Beneficiary change</option><option>Fiduciary change</option><option>Asset change</option><option>Appointment change</option><option>Document change</option><option>New will</option></select></div>
            <div class="form-group" id="matterIdGroup"><label for="crMatter">Matter ID</label><input id="crMatter" list="matterOptions" required placeholder="Type a matter ID"></div>
            <div class="form-group"><label for="docs">Affected documents</label><input id="docs" placeholder="Trust, Will..."></div>
            <div class="form-group"><label for="crImpact">Impact or notes</label><textarea id="crImpact"></textarea></div>
            <button class="btn" type="submit">Submit change request</button>
          </form>
          <p id="crOut" role="status"></p>
        </div>
      </div>
      <div class="section">
        <h2>Appointment requests</h2>
        <div id="workflowAppointments" class="card"></div>
      </div>
    </div>
    <div class="section">
      <h2>Documents</h2>
      <div class="card flush">
        <div class="table-wrap">
          <table><thead><tr><th>Matter</th><th>Document</th><th>Version</th><th>Status</th></tr></thead><tbody id="docRows"></tbody></table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="portal.js"></script>
<script>
const u = getUser();
if (!u || !getToken()) { window.location.href = "login.html"; }
else {
  const box = document.getElementById("userBox");
  const name = document.createElement("p"); name.textContent = u.name;
  const role = document.createElement("p"); role.textContent = u.role;
  const link = document.createElement("a"); link.href = "#"; link.textContent = "Sign out"; link.onclick = () => { logout(); return false; };
  box.replaceChildren(name, role, link);
}
</script>
</body>
</html>
