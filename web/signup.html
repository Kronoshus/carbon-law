<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create a private Carbon Law Group account to start a California estate-planning request."><title>Create an account | Carbon Law Group</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="img/carbon-law-group-mark.png"></head>
<body>
<div class="auth-shell">
  <a class="auth-home" href="index.html">Back to Carbon Law Group</a>
  <div class="auth-wrap">
  <form class="auth-card" id="authForm">
    <img class="auth-logo" src="img/carbon-law-group-logo.png" srcset="img/carbon-law-group-logo.png 1x, img/carbon-law-group-logo@2x.png 2x" width="126" height="35" alt="Carbon Law Group">
    <h2>Create your account</h2>
    <p>Start with an account, then send a brief consultation request. You can share detailed planning information later, after the firm contacts you.</p>
    <div class="form-group"><label for="name">Full name</label><input id="name" placeholder="Your full name" maxlength="120" autocomplete="name" required></div>
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" maxlength="254" autocomplete="email" required></div>
    <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required></div>
    <button class="btn block" id="signupBtn" type="submit">Create account</button>
    <p id="out" role="status" aria-live="polite"></p>
    <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
  </form>
  </div>
</div>
<script src="auth.js"></script>
<script>
document.getElementById("authForm")?.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("signupBtn");
  button.disabled = true; button.textContent = "Creating account…";
  try {
    const result = await api("/auth/signup","POST",{
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      role: "client"
    });
    setToken(result.token); setUser(result.user);
    document.getElementById("out").textContent = "Account created. Redirecting to your private intake...";
    setTimeout(() => window.location.href = "intake.html", 1000);
  } catch (e) { document.getElementById("out").textContent = e.message; button.disabled = false; button.textContent = "Create account"; }
});
</script>
</body>
</html>
