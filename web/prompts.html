<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Carbon Law Group staff library of California estate-planning prompts and templates."><meta name="robots" content="noindex"><title>Prompt library | Carbon Law Group</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="img/carbon-law-group-mark.png"></head>
<body>
<header class="home-nav">
  <a class="home-brand" href="index.html"><img src="img/carbon-law-group-logo.png" srcset="img/carbon-law-group-logo.png 1x, img/carbon-law-group-logo@2x.png 2x" width="126" height="35" alt="Carbon Law Group"></a>
  <a class="home-nav-cta" href="admin.html">Staff dashboard</a>
</header>
<main class="library" hidden>
<h1>PromptLaw California prompt library</h1>
<p>Browse the California estate planning prompt files and templates used for document drafting.</p>
<div class="grid">
  <div class="card"><h2>Prompts</h2><ul id="promptList"></ul></div>
  <div class="card"><h2>Templates</h2><ul id="templateList"></ul></div>
  <div class="card"><h2>Selected content</h2><pre id="contentView"></pre></div>
</div>
</main>
<footer class="home-footer"><a class="home-brand" href="index.html"><img src="img/carbon-law-group-logo.png" srcset="img/carbon-law-group-logo.png 1x, img/carbon-law-group-logo@2x.png 2x" width="126" height="35" alt="Carbon Law Group"></a><span>Carbon Law Group · <a href="tel:+13235434453">(323) 543-4453</a></span><a href="https://carbonlg.com">carbonlg.com</a></footer>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
const PROMPTS_API = "https://carbon-law.onrender.com";
function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function request(path){const headers={}; if(getToken()) headers.Authorization="Bearer "+getToken(); let res;try{res=await fetch(PROMPTS_API+path,{headers})}catch(_){throw new Error("Could not reach the Carbon backend. Check your connection and try again.")}if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.detail||`Request failed (${res.status}).`)}return res.json();}
async function loadLists() {
  try {
    const user=await CarbonAuth.requireServerAuth(["paralegal","attorney","admin"]);
    if(!user)return;
    document.querySelector(".library").hidden=false;
    const prompts = await request("/prompts");
    const pl = document.getElementById("promptList");
    pl.innerHTML = prompts.map(p=>`<li><a href="#" data-type="prompt" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)}</a></li>`).join("");
    const templates = await request("/templates");
    const tl = document.getElementById("templateList");
    tl.innerHTML = templates.map(t=>`<li><a href="#" data-type="template" data-name="${escapeHtml(t.name)}">${escapeHtml(t.name)}</a></li>`).join("");
    document.querySelectorAll("a[data-name]").forEach(a => {
      a.addEventListener("click", async (e) => {
        e.preventDefault();
        const type = a.getAttribute("data-type");
        const name = a.getAttribute("data-name");
        const view=document.getElementById("contentView");
        try { const data = await request(`/${type}s/${encodeURIComponent(name)}`); view.textContent = data.content; }
        catch(error) { view.textContent = error.message; }
      });
    });
  } catch(e) { document.querySelector(".library").hidden=false; document.getElementById("contentView").textContent = e.message; }
}
loadLists();
</script>
</body></html>
