<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Carbon Law Client Portal</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><h1>Client Portal</h1><p>View matter status, submit changes, and manage appointments.</p></header>
<main>
<section><h2>Your Matters</h2><table><thead><tr><th>Matter</th><th>Client</th><th>Stage</th><th>Owner</th><th>Risk</th><th>Next Action</th></tr></thead><tbody id="matterRows"></tbody></table><p id="matterCount"></p></section>
<section><h2>Submit Change Request</h2>
<form id="changeForm">
<input id="matter" placeholder="Matter ID" required>
<select id="changeType"><option>Beneficiary change</option><option>Fiduciary change</option><option>Asset change</option><option>Appointment change</option></select>
<input id="docs" placeholder="Affected documents">
<button type="submit">Submit</button></form></section>
<section><h2>Appointment Management</h2>
<button id="cancel">Request cancellation</button>
<button id="reschedule">Request reschedule</button></section>
<section><h2>Backend Report</h2><pre id="report"></pre></section>
<pre id="out"></pre>
</main>
<script src="app.js"></script><script src="api.js"></script><script src="portal.js"></script>
</body></html>
