<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Carbon Law Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site">
  <a href="index.html"><img class="logo" src="https://carbonlg.com/wp-content/uploads/2023/08/Carbon-Law-Group-LOGO.png" alt="Carbon Law Group"></a>
  <nav class="main">
    <a href="index.html#services">Services</a>
    <a href="portal.html">Client Portal</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>
<section class="section">
<h2>Matter Dashboard</h2>
<p>Internal matter tracker and reporting.</p>
<div class="cards">
<div class="stat"><h2 id="total">0</h2><p>Active Matters</p></div>
<div class="stat"><h2 id="highRisk">0</h2><p>High Risk</p></div>
<div class="stat"><h2 id="review">0</h2><p>Attorney Review</p></div>
<div class="stat"><h2 id="urgent">0</h2><p>Urgent</p></div>
</div>
<input id="search" placeholder="Search client or matter ID">
<select id="stageFilter"><option value="">All stages</option></select>
<select id="riskFilter"><option value="">All risk</option><option>Low</option><option>Medium</option><option>High</option></select>
<select id="ownerFilter"><option value="">All owners</option></select>
<button id="seedBtn" class="btn blue">Seed Demo Matters</button>
<table><thead><tr><th>Matter</th><th>Client</th><th>Stage</th><th>Owner</th><th>Due</th><th>Risk</th><th>Priority</th><th>Next Action</th></tr></thead><tbody id="rows"></tbody></table>
</section>
<section class="section">
<h3>Friday Report</h3>
<button id="genReport" class="btn blue">Generate Friday Report</button>
<div id="report" class="report-summary"></div>
</section>
<footer><p>Carbon Law Group | (323) 543-4453 | <a href="https://carbonlg.com">carbonlg.com</a></p></footer>
<script src="app.js"></script>
</body></html>
