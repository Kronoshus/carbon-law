<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Client Intake - Carbon Law</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site">
  <a href="index.html"><img class="logo" src="https://carbonlg.com/wp-content/uploads/2023/08/Carbon-Law-Group-LOGO.png" alt="Carbon Law Group"></a>
  <nav class="main">
    <a href="index.html#services">Services</a>
    <a href="portal.html">Client Portal</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>
<section class="section">
<h2>Estate Planning Intake</h2>
<p>Submit your information to start an estate planning matter. A consultation will be scheduled.</p>
<div class="form">
<input id="clientName" placeholder="Full name" required>
<input id="clientEmail" type="email" placeholder="Email" required>
<input id="clientPhone" placeholder="Phone">
<textarea id="clientGoals" placeholder="Estate planning goals"></textarea>
<textarea id="clientAssets" placeholder="Major assets (home, accounts, business, etc.)"></textarea>
<textarea id="clientFamily" placeholder="Family / beneficiaries"></textarea>
<button id="intakeBtn">Submit Intake</button>
<pre id="intakeOut"></pre>
</div>
</section>
<footer><p>Carbon Law Group | (323) 543-4453 | <a href="https://carbonlg.com">carbonlg.com</a></p></footer>
<script src="api.js"></script>
<script>
const API = localStorage.getItem("carbon_api") || "https://carbon-law.onrender.com";
async function request(path, method="GET", body=null){const opts={method,headers:{"Content-Type":"application/json"}}; if(body) opts.body=JSON.stringify(body); const res=await fetch(API+path,opts); if(!res.ok) throw new Error(await res.text()); return res.json();}
document.getElementById("intakeBtn")?.addEventListener("click", async () => {
  const body = {
    client_name: document.getElementById("clientName").value,
    email: document.getElementById("clientEmail").value,
    phone: document.getElementById("clientPhone").value,
    goals: document.getElementById("clientGoals").value,
    assets: document.getElementById("clientAssets").value,
    family: document.getElementById("clientFamily").value
  };
  const result = await request("/intake","POST",body);
  document.getElementById("intakeOut").textContent = JSON.stringify(result, null, 2);
});
</script>
</body></html>
